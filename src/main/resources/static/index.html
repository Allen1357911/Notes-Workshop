<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>笔记工坊 Note-Workshop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="index">
<header id="nav" class="nav"></header>

<main class="container">
    <section class="hero">
        <h1>📖 笔记工坊</h1>
        <p>面向在校学生的读书笔记社区 —— 记录你自己的思考，也能看看同学们在读什么、想了什么。</p>
        <p style="margin-top:10px;font-size:13px">辅助深度思考，而不是代替思考。</p>
    </section>

    <section class="grid-3" style="margin-bottom:22px">
        <div class="entry">
            <h3>✍️ 写读书笔记</h3>
            <p>录入图书名与正文，可上传书页截图、手写笔记照片；笔记可设为私有或公开。</p>
        </div>
        <div class="entry">
            <h3>🌐 公开笔记广场</h3>
            <p>浏览所有同学公开分享的笔记，互相借鉴；未登录也能看。</p>
        </div>
        <div class="entry">
            <h3>👍 点赞与排行</h3>
            <p>给喜欢的公开笔记点赞，看看哪些笔记最受欢迎。</p>
        </div>
    </section>

    <div class="row-between" style="margin-bottom:10px">
        <h2 class="card-title" style="margin:0">最新公开笔记</h2>
        <a href="/plaza.html">查看全部 →</a>
    </div>
    <section id="latest"></section>

    <div class="row-between" style="margin:24px 0 10px">
        <h2 class="card-title" style="margin:0">点赞排行</h2>
        <a href="/rank.html">查看完整排行 →</a>
    </div>
    <section id="rank-preview"></section>
</main>

<footer class="footer">笔记工坊 Note-Workshop · 基础版（用户 / 读书笔记 / 点赞）</footer>
<div id="toast" class="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
